<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#11695d">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>Endocrine · Picture Quiz</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <header class="top">
    <a href="./" class="brand">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span class="brand-copy">
        <span class="brand-title">Endocrine</span>
        <span class="brand-sub">PICTURE QUIZ</span>
      </span>
    </a>
    <div class="top-actions">
      <nav id="bank-switch" class="bank-switch" aria-label="Quiz section"></nav>
      <nav class="view-nav" aria-label="Current quiz section">
        <button id="home" class="quiet">Practice</button>
        <button id="review" class="quiet">Source review</button>
        <button id="progress" class="quiet">Your progress</button>
      </nav>
    </div>
  </header>
  <main id="app"><p class="notice">Loading your local question bank…</p></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <footer id="app-footer"><span id="footer-title">Endocrine · Picture Quiz</span> <span>Local study tool · Not clinical guidance</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
