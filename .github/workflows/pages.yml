name: Publish Endocrine Picture Quiz
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Run unit tests, validate, and build
        run: npm run build
      - name: Audit question quality
        run: python3 scripts/audit_question_quality.py --strict
      - name: Validate published dist
        run: python3 scripts/validate_bank.py --all --data dist/data --published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
